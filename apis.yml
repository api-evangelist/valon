aid: valon
name: Valon
description: >-
  Valon is a technology-first residential mortgage servicing platform founded
  in 2019 and headquartered in New York. Built on its own servicing system of
  record, Valon gives homeowners a modern app for payments, escrow, insurance,
  and mortgage assistance while offering lending (HELOC/HELOAN, refinance,
  purchase) and insurance products. Backed by Andreessen Horowitz and Westcap,
  Valon raised a $100M Series C in October 2024 and was approved as a Ginnie
  Mae issuer in December 2024. Its engineering arm, Valon Technologies, also
  publishes Gestalt (gestaltd.ai) — an Apache-2.0, self-hostable platform for
  managing agentic tools and services that unifies REST/OpenAPI, GraphQL, MCP,
  and executable code behind one operation model with an HTTP API, CLI, SDKs,
  and an MCP endpoint.
